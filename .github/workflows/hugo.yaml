name: Build and deploy
env:
  HUGO_VERSION: 0.170.1
  TZ: Europe/Copenhagen
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: false
      - name: Install Hugo
        run: |
          set -euo pipefail
          echo "Installing Hugo ${HUGO_VERSION}..."
          file="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl -sfL --output-dir "${{ runner.temp }}" -O "${base}/${file}"
          curl -sfL --output-dir "${{ runner.temp }}" -O "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep -F "${file}" "${{ runner.temp }}/hugo_${HUGO_VERSION}_checksums.txt"
          (cd "${{ runner.temp }}" && sha256sum --check --ignore-missing "hugo_${HUGO_VERSION}_checksums.txt")
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/${file}"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Build
        run: hugo build --gc --minify --baseURL "https://yushengzhou.github.io/"
      - name: i18n warnings
        run: |
          set -euo pipefail
          out=$(hugo --printI18nWarnings --gc --minify --baseURL "https://yushengzhou.github.io/" 2>&1)
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -F 'i18n|MISSING_TRANSLATION'; then
            echo "i18n warnings present"
            exit 1
          fi
      - name: HTML checks
        run: python3 scripts/check_site.py
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: false
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Hugo
        run: |
          set -euo pipefail
          echo "Installing Hugo ${HUGO_VERSION}..."
          file="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl -sfL --output-dir "${{ runner.temp }}" -O "${base}/${file}"
          curl -sfL --output-dir "${{ runner.temp }}" -O "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep -F "${file}" "${{ runner.temp }}/hugo_${HUGO_VERSION}_checksums.txt"
          (cd "${{ runner.temp }}" && sha256sum --check --ignore-missing "hugo_${HUGO_VERSION}_checksums.txt")
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/${file}"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Build
        run: |
          set -euo pipefail
          out=$(hugo build --gc --minify --printI18nWarnings --baseURL "${{ steps.pages.outputs.base_url }}/" 2>&1)
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -F 'i18n|MISSING_TRANSLATION'; then
            echo "i18n warnings present"
            exit 1
          fi
      - name: HTML checks
        run: python3 scripts/check_site.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./public
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
