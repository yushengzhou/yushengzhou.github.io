{{ define "main" }}
<h1>{{ .Title }}</h1>
<div class="prose">
  {{ .Content }}
</div>
{{ $pages := .RegularPages }}
{{ if $pages }}
<ul class="projects">
  {{ range $pages }}
  <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
  {{ end }}
</ul>
{{ else }}
<p class="empty">{{ i18n "projects_empty" }}</p>
{{ end }}
{{ end }}
