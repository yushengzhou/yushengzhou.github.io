<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip" href="#content">{{ i18n "skip" }}</a>
  {{ partial "header.html" . }}
  <main id="content" tabindex="-1">
    <div class="wrap">
      {{ block "main" . }}{{ end }}
    </div>
  </main>
  {{ partial "footer.html" . }}
  {{ partial "theme-ui.html" . }}
</body>
</html>
